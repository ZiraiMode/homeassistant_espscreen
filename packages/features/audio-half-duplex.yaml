# A microphone and speaker taking turns on a physical bus. Native I2S objects stay private;
# every listener and the mixer use these proxies, including readers joining during playback.
audio_half_duplex:
  id: ts_audio_transport
  # Complete root STOPPED states, not momentarily empty downstream buffers,
  # release the bus as soon as all playback has finished.
  playback_sources: [ts_speaker, ts_media_speaker]
  on_playback_stopping:
    - switch.turn_off: ${AUDIO_AMPLIFIER}
  microphone:
    id: ts_microphone
    microphone: ts_microphone_raw
    sample_rate: 16000
    bits_per_sample: 16
    num_channels: 1
  speaker:
    id: ts_speaker_out
    speaker: ts_speaker_out_raw
    sample_rate: ${AUDIO_SAMPLE_RATE}
    bits_per_sample: 16
    num_channels: 1
