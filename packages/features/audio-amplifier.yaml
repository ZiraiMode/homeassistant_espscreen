# ESP Screens - a speaker amplifier that follows buffered sound with a 300 ms hold, including on a bus whose clock
# runs continuously in silence. The board brings its enable as a switch (restore_mode: ALWAYS_OFF), named in
# AUDIO_AMPLIFIER. Half-duplex boards additionally mute it before their transport releases the clock
# (features/audio-half-duplex.yaml), without delaying microphone handoff.
interval:
  - interval: 20ms
    then:
      - lambda: |-
          static uint32_t heard = 0;
          const uint32_t now = millis();
          const bool running = id(ts_speaker_out).is_running();
          if (!running) heard = 0;
          else if (id(ts_speaker_out).has_buffered_data()) heard = now ? now : 1;
          const bool on = running && heard != 0 && now - heard < 300;
          if (on != id(${AUDIO_AMPLIFIER}).state) {
            if (on) id(${AUDIO_AMPLIFIER}).turn_on();
            else id(${AUDIO_AMPLIFIER}).turn_off();
          }
