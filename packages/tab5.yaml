# ESP Screens - the package a M5Stack Tab5 Tab5 ST7121 builds from over GitHub. Written by tools/generate_entries.py
# from boards.yaml; do not edit.
#
# ESP Screen Manager writes every screen's own YAML with `packages: display: {url: <this repository>, files:
# [packages/tab5.yaml]}` and adds the name, the Wi-Fi reference and the unique keys (docs/EASY_SETUP.md); nothing
# of that lives here. The screen is two packages: core.yaml, which every board shares, and boards/tab5.yaml with this
# board's hardware and sizes (docs/PROFILES.md). checkout/tab5.yaml builds the same two from a checkout.
substitutions:
  # Keep the board package, components and fonts on the same repository when testing a fork.
  GITHUB_REPOSITORY: "MaxGramser/homeassistant_espscreen"
  # The branch the components and the fonts come from: main, or dev for the app's dev channel.
  GITHUB_REF: "main"
  FONT_DIR: "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF}/fonts"

packages:
  core: !include core.yaml
  board: !include boards/tab5.yaml
  hotspot: !include features/hotspot.yaml

external_components:
  - source:
      type: git
      url: https://github.com/${GITHUB_REPOSITORY}.git
      ref: ${GITHUB_REF}
      path: components
    refresh: 0s
    components: [audio_half_duplex, smart_display]
